<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SelfPrint logo">
  <rect width="512" height="512" rx="112" fill="#0d7a74"/>

  <!-- sheet with QR code, feeding into the printer -->
  <rect x="176" y="112" width="160" height="150" rx="14" fill="#fdfbf7"/>
  <g fill="#0d7a74">
    <rect x="200" y="136" width="34" height="34" rx="4"/>
    <rect x="242" y="136" width="34" height="34" rx="4"/>
    <rect x="200" y="178" width="34" height="34" rx="4"/>
    <rect x="246" y="182" width="12" height="12" rx="2"/>
    <rect x="266" y="182" width="12" height="12" rx="2"/>
    <rect x="246" y="200" width="12" height="12" rx="2"/>
    <rect x="284" y="172" width="30" height="30" rx="4"/>
    <rect x="292" y="180" width="14" height="14" rx="2" fill="#fdfbf7"/>
    <rect x="210" y="146" width="14" height="14" rx="2" fill="#fdfbf7"/>
    <rect x="252" y="146" width="14" height="14" rx="2" fill="#fdfbf7"/>
    <rect x="210" y="188" width="14" height="14" rx="2" fill="#fdfbf7"/>
  </g>

  <!-- output sheet peeking below the body -->
  <rect x="184" y="330" width="144" height="86" rx="12" fill="#fdfbf7"/>
