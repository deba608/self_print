  </g>

  <!-- printer body -->
  <rect x="128" y="236" width="256" height="136" rx="30" fill="#fdfbf7"/>
  <rect x="156" y="260" width="200" height="16" rx="8" fill="#0d7a74" opacity="0.22"/>
  <circle cx="344" cy="316" r="9" fill="#0d7a74"/>
  <rect x="176" y="296" width="84" height="10" rx="5" fill="#0d7a74" opacity="0.22"/>
</svg>
