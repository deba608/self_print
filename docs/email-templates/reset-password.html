<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#f4f6f7;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f7;padding:32px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.06);">
          <tr>
            <td style="background:linear-gradient(135deg,#0d7a74 0%,#085f59 100%);padding:28px 32px;text-align:center;">
              <span style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:0.02em;">SelfPrint</span>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px 24px;">
              <h1 style="margin:0 0 12px;color:#111827;font-size:20px;">Reset your password</h1>
              <p style="margin:0 0 24px;color:#4b5563;font-size:15px;line-height:1.6;">
                We got a request to reset the password for <strong>{{ .Email }}</strong>. Click below to choose a new one.
              </p>
              <table cellpadding="0" cellspacing="0" style="margin:0 auto;">
                <tr>
                  <td style="border-radius:12px;background:linear-gradient(135deg,#0d7a74 0%,#085f59 100%);">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;">
                      Reset password
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:28px 0 0;color:#9ca3af;font-size:13px;line-height:1.6;">
                If you didn't request this, ignore this email — your password stays unchanged.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background:#f9fafb;text-align:center;">
              <span style="color:#9ca3af;font-size:12px;">SelfPrint &middot; Print Queue System</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
