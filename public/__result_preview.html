<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="http://localhost:3000/_next/static/css/app/layout.css">
<style>body{margin:0;font-family:sans-serif;background:#f4f6f7;padding:16px;}</style>
</head>
<body>
<div class="result-screen result-success">
  <h2 class="success-title">Print Job Submitted</h2>
  <div class="result-meta">
    <div class="result-meta-item"><span class="result-meta-label">Token</span><span class="result-meta-value">239636</span></div>
    <div class="result-meta-divider"></div>
    <div class="result-meta-item"><span class="result-meta-label">Queue</span><span class="result-meta-value">#26</span></div>
  </div>

  <div class="mini-track">
    <div class="mini-track-head">
      <span class="mini-track-title">Live status</span>
      <span class="mini-track-eta">~36 min wait</span>
    </div>
    <div class="mini-timeline">
      <div class="mini-step done"><span class="mini-step-dot">1</span><span class="mini-step-label">Submitted</span></div>
      <div class="mini-step active"><span class="mini-step-dot">2</span><span class="mini-step-label">Paid</span></div>
      <div class="mini-step todo"><span class="mini-step-dot">3</span><span class="mini-step-label">Printing</span></div>
      <div class="mini-step todo"><span class="mini-step-dot">4</span><span class="mini-step-label">Ready</span></div>
    </div>
  </div>

  <div class="review-prompt">
    <p>Enjoying the wait? Leave us a quick rating.</p>
    <a class="result-screen-review" href="#">★ Rate us on Google</a>
  </div>

  <div class="result-screen-actions">
    <a class="btn-secondary result-screen-link" href="#">Track this order</a>
    <button class="btn-secondary result-screen-link">Upload Another</button>
  </div>

  <div class="thank-you-note">
    <p>Thank you for using Self_Print</p>
    <p class="visit-again">We appreciate your business</p>
  </div>
</div>
</body>
</html>
