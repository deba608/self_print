<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Self_Print — Offline</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    color: #111827;
    padding: 24px;
  }
  .card {
    max-width: 340px;
    width: 100%;
    background: #fff;
    border: 1px solid #d4dbe4;
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
  }
  .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    border-radius: 14px;
    background: #e4f4f1;
    color: #0d7a74;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #5a6578; margin: 0 0 20px; line-height: 1.5; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #0d7a74;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0119 12.55" />
        <path d="M5 12.55a10.94 10.94 0 015.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0122.58 9" />
        <path d="M1.42 9a15.91 15.91 0 014.7-2.88" />
        <path d="M8.53 16.11a6 6 0 016.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p>Self_Print needs a connection to load your order status. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
