<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="http://localhost:3000/_next/static/css/app/layout.css">
<style>body{margin:0;font-family:sans-serif;background:#f4f6f7;padding:12px;}</style>
</head>
<body>
<div class="job-list">
<div class="job-card pending_payment" id="card1">
  <button class="job-checkbox" type="button"><span class="checkbox-circle"></span></button>
  <div class="job-content">
    <div class="job-header"><div class="job-title"><span class="queue-num">#12</span><span class="job-token">Token 513494</span></div></div>
    <div class="job-details">
      <span class="file-name">Court new.pdf</span>
      <div class="job-time"><span>01/08/26 at 19:20</span></div>
    </div>
  </div>
  <div class="job-side">
    <div class="job-actions">
      <div class="job-actions-status">
        <span class="status-badge info">Queued</span>
      </div>
      <div class="job-actions-primary">
        <div class="print-mode-group">
          <div class="print-mode-switch">
            <button type="button" class="print-mode-opt active">Auto</button>
            <button type="button" class="print-mode-opt">Manual</button>
          </div>
          <button type="button" class="job-btn release"><span>Release</span></button>
        </div>
      </div>
      <div class="job-actions-utility">
        <button type="button" class="job-btn view" aria-label="view">E</button>
        <button type="button" class="job-btn cancel" aria-label="cancel">X</button>
      </div>
    </div>
    <div class="job-pay-row">
      <span class="job-price">₹15.50</span>
      <span class="status-badge warn">Unpaid</span>
      <button type="button" class="job-btn paid" aria-label="Mark as paid">P<span>Mark as Paid</span></button>
    </div>
  </div>
</div>
</div>
</body>
</html>
